[project]
name = "retention-radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "streamlit>=1.59.1",
    "ucimlrepo>=0.0.7",
    "xgboost>=3.4.1",
]

[project.scripts]
retention-radar = "retention_radar:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "jupyterlab>=4.6.3",
    "ruff>=0.16.3",
]
